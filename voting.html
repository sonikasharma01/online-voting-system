<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voting Page</title>
  <script type="module" src="voting.js"></script>
  <link rel="stylesheet" href="voting.css">
</head>

<body>

  <h1 id="heading">Online Voting System</h1>

  <div class="container">

    <!-- BJP -->
    <div class="card">

      <div class="left">

        <img
        src="https://upload.wikimedia.org/wikipedia/commons/thumb/7/78/Logo_of_the_Bharatiya_Janata_Party.svg/1280px-Logo_of_the_Bharatiya_Janata_Party.svg.png"
        alt="BJP Symbol">

        <h2>BJP</h2>

      </div>

      <button id="bjpBtn">
        Vote
      </button>

    </div>

    <!-- Congress -->
    <div class="card">

      <div class="left">

        <img
        src="https://upload.wikimedia.org/wikipedia/commons/thumb/6/6c/Indian_National_Congress_hand_logo.svg/250px-Indian_National_Congress_hand_logo.svg.png"
        alt="Congress Symbol">

        <h2>Congress</h2>

      </div>

      <button id="congressBtn">
        Vote
      </button>

    </div>

    <!-- Samajwadi Party -->
    <div class="card">

      <div class="left">

        <img
        src="https://upload.wikimedia.org/wikipedia/commons/b/b2/Indian_Election_Symbol_Cycle.png"
        alt="Cycle Symbol">

        <h2>Samajwadi Party</h2>

      </div>

      <button id="spBtn">
        Vote
      </button>

    </div>

    <!-- NCP -->
    <div class="card">

      <div class="left">

        <img
        src="https://upload.wikimedia.org/wikipedia/commons/thumb/5/57/Indian_Election_Symbol_Clock.png/1280px-Indian_Election_Symbol_Clock.png"
        alt="NCP Symbol">

        <h2>NCP</h2>

      </div>

      <button id="ncpBtn">
        Vote
      </button>

    </div>

  </div>

</body>
</html>
